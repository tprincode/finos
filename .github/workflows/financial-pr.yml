# Financial PR — MAGI gate and seed (ADR-0013)
#
# Never skip magi-gate. Never rewrite owner-approved MAGI oracles.

name: financial-pr

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  magi-and-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: MAGI pack on the production path
        run: cargo test -p golden-harness --features magi-gate --test magi_pack

  seed-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Synthetic M2 seed_counts
        run: cargo test -p golden-harness --test seed_reconcile -- seed_counts
      - name: Production seed unique yields vs locked template
        run: cargo test -p golden-harness --test production_seed -- production_seed_counts

  lots-roi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CRF lots policy
        run: cargo test -p golden-harness --test lots_roi
