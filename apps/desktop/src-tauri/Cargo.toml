[workspace]

[package]
name = "finos-desktop"
version = "0.1.0"
description = "Finance Management System desktop shell (Tauri 2)"
edition = "2021"

[lib]
name = "finos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
application-core = { path = "../../../crates/application-core" }
storage-sqlite = { path = "../../../crates/storage-sqlite" }
ai-gateway = { path = "../../../crates/ai-gateway" }
dotenvy = "0.15"
