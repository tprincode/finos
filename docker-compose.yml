services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: finos
      POSTGRES_PASSWORD: finos
      POSTGRES_DB: finos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finos -d finos"]
      interval: 2s
      timeout: 5s
      retries: 20
